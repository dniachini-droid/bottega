name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Budgets
        run: node tools/check-budgets.mjs

      # Node's own test runner, with nothing installed. It finds every file
      # named *.test.mjs and runs it. There is no package.json here and there
      # should not be one: this repository is a workshop, not an application,
      # and a dependency to run tests is more than the job needs.
      - name: Tests
        run: node --test
